<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Music Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 6rem;
      margin: 0;
      background: linear-gradient(135deg, #f6b83e, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p { color: #b0b0b0; margin: 16px 0 32px; font-size: 1.1rem; }
    a {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #f6b83e, #ff6b35);
      color: #0a0a0a;
      text-decoration: none;
      border-radius: 9999px;
      font-weight: 600;
      transition: 0.3s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(246,184,62,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Esta página no existe. O tal vez aún no la han compuesto.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
